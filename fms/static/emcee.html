<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="/manifest/emcee.json">
<link rel="apple-touch-icon" href="/static/icon.svg">
<meta name="theme-color" content="#161a1f">
<link rel="stylesheet" href="/static/style.css">
<title>FMS Emcee</title>
<style>
  .big { text-align: center; padding: 1.3rem 1rem; }
  .big .clock { font-size: 4.2rem; }
  .big .phase { font-size: 1.05rem; margin-top: .3rem; }
  .hub { padding: 1.4rem .8rem; }
  .hub .state { font-size: 2.6rem; }
  .next { font-size: 1.05rem; font-weight: 700; text-align: center; margin: .75rem 0; padding: .7rem .9rem;
    border-radius: var(--r-md); background: var(--panel); border: 1px solid var(--line); }
  .next:empty { display: none; }
  .next.soon { color: #fff; background: var(--warn); border-color: var(--warn); }
  .auto h3 { font-size: 1.35rem; margin-bottom: .4rem; }
  .lock { width: 100%; min-height: 3.8rem; font-size: 1.15rem; margin-top: .8rem; }
  .scoreline { display: flex; justify-content: space-between; align-items: center; gap: .75rem; padding: .55rem 0; }
  .scoreline + .scoreline { border-top: 1px solid var(--line); }
  .scoreline .teams { font-size: .95rem; }
</style>
</head><body>
<div class="bar"><span><span class="conn"></span> <b id="mk">–</b></span><span id="st" class="pill">–</span></div>
<main class="wrap" id="app" hidden>
  <div class="panel big"><div class="clock num" id="clk">–:––</div><div class="phase" id="ph">–</div></div>
  <div class="hubs">
    <div class="hub red" id="hr"><div class="name tred">Red hub</div><div class="state" id="hrs">–</div></div>
    <div class="hub blue" id="hb"><div class="name tblue">Blue hub</div><div class="state" id="hbs">–</div></div>
  </div>
  <div class="next" id="nx"></div>
  <div class="panel auto" id="auto" style="margin-top:1rem"></div>
  <div class="panel"><div class="scoreline">
    <span class="teams tred" id="rt">Red</span><span class="score num tred" id="rs">0</span></div>
    <div class="scoreline">
    <span class="teams tblue" id="bt">Blue</span><span class="score num tblue" id="bs">0</span></div>
    <div class="hint">Live score is provisional until the scorekeeper commits it.</div></div>
</main>
<script src="/static/common.js"></script>
<script>
const { $, esc } = FMS;
let buzzed = null;
FMS.gate("emcee").then(() => { $("#app").hidden = false; FMS.connect(); });

function side(a) { return a === "red" ? "Red" : "Blue"; }

FMS.on((s) => {
  const cur = s.current, g = s.game;
  $("#mk").textContent = cur ? cur.key : "–";
  $("#st").textContent = cur ? cur.status : "–";
  $("#rt").textContent = cur ? cur.red.join(" · ") : "Red";
  $("#bt").textContent = cur ? cur.blue.join(" · ") : "Blue";
  $("#rs").textContent = cur && cur.score ? cur.score.red.total : 0;
  $("#bs").textContent = cur && cur.score ? cur.score.blue.total : 0;
  const box = $("#auto");
  if (!cur || !cur.first_inactive) {
    box.innerHTML = `<h3>Auto result</h3><div class="muted">Shows here ${g.score_grace_s}s after auto ends.</div>`;
    return;
  }
  const sc = cur.score, fi = cur.first_inactive, on = fi === "red" ? "blue" : "red";
  const ra = sc.red.auto_fuel, ba = sc.blue.auto_fuel;
  const close = Math.abs(ra - ba) <= g.close_auto_margin;
  box.innerHTML = `
    <h3 class="t${fi}">${cur.fi_coin ? "Auto tied — coin flip: " + side(fi) : side(fi) + " won auto"}</h3>
    <div class="num">Auto fuel: <b class="tred">${ra}</b> red, <b class="tblue">${ba}</b> blue</div>
    <div style="margin-top:.5rem"><b>Shift 1:</b> ${side(fi)} hub OFF, ${side(on)} hub ON</div>
    ${close && !cur.fi_locked ? `<div class="warnbox" style="margin-top:.6rem">Close auto (within ${g.close_auto_margin}). Get the head ref's call before setting lights.</div>` : ""}
    ${cur.fi_locked ? `<div class="pill ok" style="margin-top:.7rem">Lights set · locked</div>`
      : `<button class="lock primary" id="lk">Lights set: ${side(fi)} off first</button>`}`;
  const lk = $("#lk");
  if (lk) lk.onclick = async () => {
    try { await FMS.api("/api/match/first_inactive", { key: cur.key, lock: true }); }
    catch (e) { FMS.toast(e.message, true); }
  };
});

everyFrame(() => {
  const cur = FMS.state && FMS.state.current, p = FMS.phase(cur);
  $("#clk").textContent = FMS.mmss(p.clock);
  $("#ph").textContent = p.label + (p.remaining != null && p.name !== "post" ? ` · ${FMS.mmss(p.remaining)}` : "");
  const act = p.active || { red: false, blue: false };
  const live = !["idle", "pre", "post", "pause"].includes(p.name);
  for (const [id, a] of [["#hr", "red"], ["#hb", "blue"]]) {
    const onNow = live && act[a];
    $(id).classList.toggle("on", onNow);
    $(id).classList.toggle("off", !onNow);
    $(id + "s").textContent = !live ? "–" : onNow ? "ON" : "OFF";
  }
  const nx = $("#nx");
  const n = p.next;
  if (live && n && cur.first_inactive) {
    const dt = n.start - FMS.now();
    const txt = `In ${Math.ceil(dt)}s → ${FMS.LABEL[n.name]}: Red ${n.active.red ? "ON" : "OFF"}, Blue ${n.active.blue ? "ON" : "OFF"}`;
    nx.textContent = txt;
    nx.classList.toggle("soon", dt <= 5);
    const tag = cur.key + n.name;
    if (dt <= 3 && buzzed !== tag && (n.active.red !== act.red || n.active.blue !== act.blue)) {
      buzzed = tag;
      if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
    }
  } else if (live && n && n.name === "shift1") {
    nx.textContent = "Waiting for auto result…";
    nx.classList.remove("soon");
  } else { nx.textContent = ""; }
});
</script>
</body></html>
