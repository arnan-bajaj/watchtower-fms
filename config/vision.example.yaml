# Camera configuration. `python -m fms.init` copies this to config/vision.yaml (gitignored),
# where you set camera sources and the hub ROIs from pick_roi.py.
fms_url: http://127.0.0.1:8000
# vision_key: defaults to server.vision_key in config/event.yaml
record_dir: recordings           # raw hub video per match (for rescoring + training data); "" to disable

# Optional: live count feeds to field systems that decide the auto winner and light the hubs
# themselves (e.g. bioarena in "Counted" mode). Each gets every count over UDP the moment it
# happens. Add as many as you like, or pass `--feed HOST:PORT` to run_vision.py instead.
# Any network the Mac shares with the field works (e.g. venue WiFi). The receiver usually accepts
# only one source address: enter this Mac's IP on that network in the field's settings
# (bioarena: Settings -> Hub FUEL Counter). It changes per network, so re-check it at each venue.
# feeds:
#   - name: bioarena
#     host: 192.168.1.50         # the field's IP on that network
#     port: 8411                 # default 8411
#     bind: 192.168.1.23         # optional: force the source address if the Mac has several links
#     heartbeat_s: 0.1           # optional

defaults:                        # applied to both hubs unless overridden
  counter: zone                  # zone | linecross | mock | a plugin's name | "module:Class"
  # `python run_vision.py --list-counters` shows what's available. External ones
  # (README "Counter plugins"): drop a .py into vision/plugins/, or add a repo
  # with `python run_vision.py --add-plugin ~/dev/YOLOv26-FRC-Model` (or
  # pip install -e it / list it in plugin_paths: above). Then e.g.:
  #   counter: tbavid-colour     (or tbavid-combo + model: path/to/fuel_relabel.pt)
  #   and per hub: setup: path/to/cams.json, camera: <name>
  weights: models/fuel_best.pt   # drop new weights here, restart vision; FMS never needs to restart
  conf: 0.25
  imgsz: 640
  crop_pad: 60
  max_px: 60
  min_hits: 2
  max_missed: 3
  min_dy: 0
  width: 1920
  height: 1080
  fps: 30

hubs:
  red:
    source: 0                    # camera index, video file path, or rtsp:// URL
    roi: [800, 300, 320, 180]    # from pick_roi.py
  blue:
    source: 1
    roi: [800, 300, 320, 180]

# Rehearsal without a model or cameras:
#   defaults: {counter: mock, rate_per_s: 3}
#   hubs: {red: {source: none}, blue: {source: none}}
