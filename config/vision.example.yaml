# Camera configuration. `python -m fms.init` copies this to config/vision.yaml (gitignored),
# where you set camera sources and the hub ROIs from pick_roi.py.
fms_url: http://127.0.0.1:8000
# vision_key: defaults to server.vision_key in config/event.yaml
record_dir: recordings           # raw hub video per match (for rescoring + training data); "" to disable

# Optional: live count feeds to field systems that decide the auto winner and light the hubs
# themselves (e.g. bioarena in "Counted" mode). Each gets every count over UDP the moment it
# happens. Add as many as you like, or pass `--feed HOST:PORT` to run_vision.py instead.
# The receiver usually only accepts one source address, so the Mac needs a link on that
# network with that address (bioarena: wired to the field switch, Settings -> Hub FUEL Counter).
# feeds:
#   - name: bioarena
#     host: 10.0.100.5
#     port: 8411                 # default 8411
#     bind: 10.0.100.21          # optional: source address, if the Mac has several on that subnet
#     heartbeat_s: 0.1           # optional

defaults:                        # applied to both hubs unless overridden
  counter: zone                  # zone | linecross | mock | "your_module:YourClass"
  weights: models/fuel_best.pt   # drop new weights here, restart vision; FMS never needs to restart
  conf: 0.25
  imgsz: 640
  crop_pad: 60
  max_px: 60
  min_hits: 2
  max_missed: 3
  min_dy: 0
  width: 1920
  height: 1080
  fps: 30

hubs:
  red:
    source: 0                    # camera index, video file path, or rtsp:// URL
    roi: [800, 300, 320, 180]    # from pick_roi.py
  blue:
    source: 1
    roi: [800, 300, 320, 180]

# Rehearsal without a model or cameras:
#   defaults: {counter: mock, rate_per_s: 3}
#   hubs: {red: {source: none}, blue: {source: none}}
