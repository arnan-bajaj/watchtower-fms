# Event configuration. Copy to config/event.yaml with `python -m fms.init` (it also generates
# random PINs and a vision key), then set the event name, date, teams and TBA key below.
# config/event.yaml is gitignored, so your PINs and event details stay out of the repo.
# ---------------------------------------------------------------- event
event:
  name: "My Offseason Event"
  date: ""                      # YYYY-MM-DD; used for TBA match times
  utc_offset_hours: -7          # your local offset from UTC on event day (PDT = -7, EDT = -4)
  tba_event_key: ""             # e.g. 2026abcd, once your event exists on TBA
  teams: []                     # team numbers, e.g. [254, 1678, 971, ...]; at least 12 for alliance selection
  qual_start: "09:30"
  cycle_min: 8                  # match-to-match time; drives the schedule clock
  lunch: "12:00"                # schedule preview warns if quals run past this

# ---------------------------------------------------------------- server
server:
  host: 0.0.0.0
  port: 8000
  db: data/fms.sqlite3
  pins:                         # `python -m fms.init` fills these with random PINs
    control: "CHANGE-ME"
    ref: "CHANGE-ME"
    emcee: "CHANGE-ME"
  vision_key: "CHANGE-ME"       # shared with the vision process (it reads this file)

# ---------------------------------------------------------------- TBA trusted API
tba:
  enabled: false                # turn on once TBA auth works (test with 1 match first)
  # Prefer env vars: export TBA_AUTH_ID=... TBA_AUTH_SECRET=...
  auth_id: ""
  auth_secret: ""
  send_score_breakdown: false   # TBA validates breakdown keys per season; totals-only is safe
  retry_s: 15

# ---------------------------------------------------------------- REBUILT rules
# VERIFY every number against the 2026 Game Manual (section 6) before the event.
# Sources disagree on teleop Level 1 (10 vs 15). Everything scores from these values.
game:
  auto_s: 20
  auto_teleop_gap_s: 3          # pause between auto and teleop if nobody clicks "Teleop started"
  transition_s: 10
  shift_s: 25
  n_shifts: 4
  endgame_s: 30
  score_grace_s: 3              # fuel landing this long after a hub deactivates still counts
  close_auto_margin: 5          # emcee/control get a "confirm" warning if auto is this close
  fuel_points: 1
  auto_tower_l1: 15
  tower: {L0: 0, L1: 10, L2: 20, L3: 30}
  fouls: {minor: 5, major: 15}
  rp:
    win: 3
    tie: 1
    energized_fuel: 100
    supercharged_fuel: 360
    traversal_tower_points: 50
